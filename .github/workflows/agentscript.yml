name: Agentscript

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRANE_VERSION: v0.2.0
  CRANE_SHA256: d30f5d8c220d3308a528d5243716be32037157bfaba2fc5dc45474d5c9f7de12

jobs:
  policy:
    name: Validate Agentscript policies
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned Crane release
        shell: bash
        run: |
          set -euo pipefail
          archive="crane-${CRANE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/VishuKalier2003/Agentscript/releases/download/${CRANE_VERSION}"
          curl --fail --silent --show-error --location \
            --output "$archive" "$url/$archive"
          printf '%s  %s\n' "$CRANE_SHA256" "$archive" | sha256sum --check -
          mkdir -p .crane-bin
          tar -xzf "$archive" --strip-components=1 -C .crane-bin
          chmod +x .crane-bin/crane

      - name: Verify Crane release
        run: ./.crane-bin/crane --version

      - name: Show active Crane context
        run: ./.crane-bin/crane context

      - name: Run Crane policies
        run: ./.crane-bin/crane check --json
